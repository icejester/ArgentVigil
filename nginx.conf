# ArgentVigil frontend nginx config (api-split-implementation-plan.md
# Stories 1.3/1.4). Serves the built Vite SPA as static files, plus proxies
# /stack_images/* to the api service so stack_tracker.jsx's existing
# relative <img src="/stack_images/..."> tags keep resolving once web and
# api are different origins. "api" below is docker-compose's service name
# for the backend container (see docker-compose.yml), resolved via
# compose's internal DNS — not a real LAN hostname.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /stack_images/ {
        proxy_pass http://api:8000/stack_images/;
    }

    # Same-origin API proxy: the frontend is built with an empty
    # VITE_API_BASE_URL, so every apiFetch call is a relative /api/v1/...
    # path that lands here. No host/IP is baked into the bundle and the
    # browser never makes a cross-origin request (so no CORS). No URI part
    # on proxy_pass: the request path is forwarded unchanged. Long read
    # timeout since a few routes (force refresh, backfills) can be slow.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
