# ArgentVigil frontend nginx config (api-split-implementation-plan.md
# Stories 1.3/1.4). Serves the built Vite SPA as static files, plus proxies
# /stack_images/* to the api service so stack_tracker.jsx's existing
# relative <img src="/stack_images/..."> tags keep resolving once web and
# api are different origins. "api" below is docker-compose's service name
# for the backend container (see docker-compose.yml), resolved via
# compose's internal DNS — not a real LAN hostname.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /stack_images/ {
        proxy_pass http://api:8000/stack_images/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
